<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Igor Cardines</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1d1d1b; --muted: #6b6a66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe6; --muted: #9a9993; } }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 400; letter-spacing: -0.02em; }
    p { margin-top: 1rem; color: var(--muted); font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Igor Cardines</h1>
    <p>Sito in costruzione.</p>
  </main>
</body>
</html>
